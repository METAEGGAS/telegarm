<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f1b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>الإشعارات</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:"Tajawal",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0e1220;color:#eaf0ff;overflow:hidden}img{display:block}button{font-family:inherit}a{color:inherit;text-decoration:none}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2a3146;border-radius:10px}.header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08);background:#0b0f1b}.header .l{display:flex;align-items:center;gap:10px}.back{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#0f1426;color:#eaf0ff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;transition:all .3s}.back:active{transform:translateY(1px);opacity:.95}.back.holding{background:#3b82f6;border-color:#3b82f6}.back.holding::after{content:'';position:absolute;bottom:-3px;left:0;height:3px;background:#12e957;border-radius:3px;animation:fill 5s linear}.header h1{font-size:16px;font-weight:950;position:absolute;left:14px}.header h1 span{color:#3b82f6}.main{height:calc(100% - 56px);overflow:auto;padding:12px 14px 78px}.notif-card{background:linear-gradient(180deg,#161d32,#141a2d);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:0;margin-bottom:14px;overflow:hidden}.notif-img{width:100%;height:auto;display:block}.notif-content{padding:14px 16px}.notif-title{font-size:15px;font-weight:900;margin-bottom:8px;line-height:1.4}.notif-desc{font-size:13.5px;font-weight:500;color:#eaf0ff;line-height:1.6;margin-bottom:12px}.notif-read{font-size:13px;font-weight:800;color:#3b82f6;cursor:pointer;display:inline-block}.notif-read:active{opacity:.7}.bottom-nav{position:fixed;left:0;bottom:0;width:100%;height:56px;background:#0b0f1b;border-top:1px solid rgba(255,255,255,.10);display:flex;z-index:2000}.nav-item{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer}.nav-icon{width:24px;height:24px;object-fit:contain;filter:contrast(1.2) brightness(1.15) drop-shadow(0 10px 18px rgba(0,0,0,.35))}.nav-item.active .nav-icon{filter:contrast(1.35) brightness(1.25) drop-shadow(0 0 10px rgba(255,255,255,.22))}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:3000;align-items:center;justify-content:center;animation:fadeIn .3s}.modal.show{display:flex}.modal-box{background:#161d32;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;width:90%;max-width:400px;animation:slideUp .3s}.modal-box h2{font-size:18px;margin-bottom:16px;color:#3b82f6}.modal-box input,.modal-box textarea{width:100%;background:#0f1426;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px;color:#eaf0ff;font-family:inherit;margin-bottom:12px;font-size:14px}.modal-box textarea{resize:vertical;min-height:80px}.modal-box .color-pick{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.modal-box .color-pick div{width:40px;height:40px;border-radius:8px;cursor:pointer;border:2px solid transparent}.modal-box .color-pick div.sel{border-color:#fff}.modal-box .btns{display:flex;gap:10px}.modal-box button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}.modal-box .btn-add{background:#3b82f6;color:#fff}.modal-box .btn-cancel{background:#2a3146;color:#eaf0ff}@keyframes fill{from{width:0}to{width:100%}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}</style></head><body><div class="header"><div class="l"><button class="back" id="backBtn" aria-label="رجوع">←</button></div><h1>bin<span>exia</span></h1></div><div class="main" id="notifList"></div><div class="bottom-nav" id="bn"><div class="nav-item" data-go="home.html"><img class="nav-icon" src="https://cdn-icons-png.flaticon.com/128/893/893214.png" alt=""></div><div class="nav-item" data-go="ranked.html"><img class="nav-icon" src="https://cdn-icons-png.flaticon.com/128/8490/8490818.png" alt=""></div><div class="nav-item active" data-go="notifications.html"><img class="nav-icon" src="https://cdn-icons-png.flaticon.com/128/9783/9783934.png" alt=""></div><div class="nav-item" data-go="settings.html"><img class="nav-icon" src="https://cdn-icons-png.flaticon.com/128/14026/14026955.png" alt=""></div></div><div class="modal" id="modal"><div class="modal-box"><h2>إضافة إشعار جديد</h2><input type="text" id="inTitle" placeholder="العنوان"><div class="color-pick" id="colorPick"><div style="background:#ff4d4d" data-c="#ff4d4d"></div><div style="background:#3b82f6" data-c="#3b82f6"></div><div style="background:#12e957" data-c="#12e957"></div><div style="background:#ffa500" data-c="#ffa500"></div><div style="background:#9333ea" data-c="#9333ea"></div></div><input type="text" id="inImg" placeholder="رابط الصورة"><textarea id="inDesc" placeholder="الوصف"></textarea><div class="btns"><button class="btn-cancel" id="btnCancel">إلغاء</button><button class="btn-add" id="btnAdd">إضافة</button></div></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";import{getFirestore,collection,addDoc,onSnapshot,orderBy,query}from"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";const cfg={apiKey:"AIzaSyBOUqLixfphg3b8hajc4hkwV-VJmldGBVw",authDomain:"randers-c640b.firebaseapp.com",projectId:"randers-c640b",storageBucket:"randers-c640b.firebasestorage.app",messagingSenderId:"391496092929",appId:"1:391496092929:web:58208b4eb3e6f9a8571f00"},app=initializeApp(cfg),db=getFirestore(app),$=s=>document.querySelector(s),aa=u=>location.href=u;let tm,selColor="#ff4d4d",holding=false;const startHold=()=>{holding=true;$("#backBtn").classList.add("holding");tm=setTimeout(()=>{$("#modal").classList.add("show");$("#backBtn").classList.remove("holding");holding=false},5e3)},endHold=()=>{if(holding){clearTimeout(tm);$("#backBtn").classList.remove("holding");holding=false}};$("#backBtn").addEventListener("mousedown",startHold);$("#backBtn").addEventListener("mouseup",endHold);$("#backBtn").addEventListener("mouseleave",endHold);$("#backBtn").addEventListener("touchstart",e=>{e.preventDefault();startHold()});$("#backBtn").addEventListener("touchend",e=>{e.preventDefault();endHold()});$("#backBtn").addEventListener("touchcancel",endHold);$("#backBtn").onclick=e=>{if(!holding)history.back()};document.querySelectorAll("#bn .nav-item").forEach(it=>{it.onclick=()=>{const go=it.dataset.go;if(go)aa(go)};it.onmousedown=e=>e.preventDefault()});document.querySelectorAll("#colorPick div").forEach(d=>{d.onclick=()=>{document.querySelectorAll("#colorPick div").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");selColor=d.dataset.c}});document.querySelector("#colorPick div").classList.add("sel");$("#btnCancel").onclick=()=>$("#modal").classList.remove("show");$("#btnAdd").onclick=async()=>{const t=$("#inTitle").value.trim(),i=$("#inImg").value.trim(),d=$("#inDesc").value.trim();if(!t||!d)return alert("يرجى ملء العنوان والوصف");await addDoc(collection(db,"notifications"),{title:t,img:i,desc:d,color:selColor,time:Date.now()});$("#inTitle").value="";$("#inImg").value="";$("#inDesc").value="";$("#modal").classList.remove("show")};const q=query(collection(db,"notifications"),orderBy("time","desc"));onSnapshot(q,snap=>{$("#notifList").innerHTML="";snap.forEach(doc=>{const n=doc.data(),c=document.createElement("div");c.className="notif-card";c.innerHTML=`${n.img?`<img class="notif-img" src="${n.img}" alt="notification">`:""}
<div class="notif-content"><div class="notif-title" style="color:${n.color}">${n.title}</div><div class="notif-desc">${n.desc}</div><span class="notif-read" onclick="this.textContent='تم القراءة ✓';this.style.color='#12e957';this.style.pointerEvents='none'">تحديد كمقروء</span></div>`;$("#notifList").appendChild(c)})});</script></body></html>
