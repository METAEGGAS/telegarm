<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;width:100%;overflow-x:hidden}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#000;color:#fff;min-height:100vh;padding-top:50.6px;padding-bottom:62px;letter-spacing:.1px;direction:rtl}button,input{font:inherit;border:0;outline:0}button{cursor:pointer}:root{--bg-primary:#000;--bg-secondary:#0d1117;--bg-card:#101a2f;--bg-overlay:rgba(10,22,40,.72);--border-primary:rgba(255,255,255,.10);--border-secondary:#1f2937;--text-primary:#fff;--text-secondary:#d9e6ff;--accent-green:#00ff41;--accent-red:#ff0000;--accent-blue:#4299e1;--navy:#1b2a44}.container{max-width:560px;margin:0 auto}.top-bar{position:fixed;left:0;right:0;top:0;height:50.6px;display:flex;justify-content:space-between;align-items:center;padding:6.6px 8.8px;background:var(--bg-primary);border-bottom:1.1px solid var(--border-secondary);z-index:2600}.balance{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--bg-card) 0%,var(--bg-secondary) 100%);border:1.5px solid var(--border-primary);border-radius:12px;padding:8px 12px;cursor:pointer;position:relative;transition:.2s;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:2601;min-width:190px}.balance:hover{border-color:var(--accent-blue);box-shadow:0 6px 16px rgba(66,153,225,.3);transform:translateY(-1px)}.balance:active{transform:translateY(0)}.balanceMain{display:flex;align-items:center;gap:7px;flex:1;min-width:0}.balance-amount{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow-down{width:14px;height:14px;margin-right:2px;transition:transform .2s}.balance.open .arrow-down{transform:rotate(180deg)}.flag-icon{width:20px;height:14px;border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.3)}.accMenu{position:fixed;top:58px;right:8.8px;width:240px;background:linear-gradient(145deg,var(--bg-card) 0%,var(--bg-secondary) 100%);border:2px solid var(--border-primary);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05) inset;padding:10px;z-index:99999;display:none}.accMenu.show{display:block}.accItem{background:rgba(255,255,255,.03);border:1.3px solid var(--border-primary);border-radius:12px;padding:10px 12px;margin-bottom:9px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between;gap:10px}.accItem:hover{background:rgba(255,255,255,.06);border-color:var(--accent-blue)}.accItem.active{background:linear-gradient(135deg,rgba(66,153,225,.15) 0%,rgba(49,130,206,.1) 100%);border-color:var(--accent-blue);box-shadow:0 0 12px rgba(66,153,225,.2)}.accL{display:flex;align-items:center;gap:10px;min-width:0}.accIco{width:22px;height:22px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}.accAmt{font-size:16px;font-weight:1000;color:var(--text-primary);white-space:nowrap}.refillBtn{width:100%;background:linear-gradient(135deg,var(--accent-blue) 0%,#3182ce 100%);border-radius:10px;padding:10px;font-size:12px;font-weight:1000;color:var(--text-primary);letter-spacing:.5px;box-shadow:0 4px 12px rgba(66,153,225,.4)}.refillBtn:active{opacity:.85}.accSwitch{display:flex;gap:8px;background:var(--bg-secondary);border-radius:10px;padding:4px;margin-bottom:12px}.accSwitchBtn{flex:1;padding:8px;border-radius:8px;font-size:11px;font-weight:900;transition:.2s;border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px}.accSwitchBtn.live{color:#00ff41}.accSwitchBtn.demo{color:#ffd700}.accSwitchBtn.active{background:rgba(255,255,255,.1);border-color:currentColor}.top-icons{display:flex;gap:6.6px;position:absolute;left:8.8px;top:6.6px;z-index:2602}.icon-box{width:36.3px;height:36.3px;display:flex;align-items:center;justify-content:center;border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s;background:var(--bg-secondary);border:1.1px solid var(--border-secondary)}.icon-box:hover{transform:scale(1.05)}.icon-box img{width:100%;height:100%;object-fit:cover;display:block}.icon-box.green-box{background:linear-gradient(135deg,#00ff41 0%,#00cc33 100%);border-color:#00ff41;box-shadow:0 0 12px rgba(0,255,65,.4)}.icon-box.green-box img{filter:none}.header{padding:14px 12px 10px;background:linear-gradient(180deg,#0f1b2e,#0c1627);border-bottom:1px solid rgba(31,51,86,.75)}.header h1{font-size:16px;font-weight:1000;color:#fff;letter-spacing:.3px}.sub{margin-top:10px;background:linear-gradient(180deg,var(--bg-card),#0c1627);border:1px solid var(--border-primary);border-radius:14px;padding:12px;box-shadow:0 10px 22px rgba(0,0,0,.35)}.subTitle{font-size:12px;color:#fff;font-weight:1000;letter-spacing:.35px}.social-label{text-align:center;padding:12px;font-size:12px;color:var(--text-secondary)}.accounts-list{margin:12px 12px;background:linear-gradient(180deg,var(--bg-card),#0c1627);border-radius:14px;box-shadow:0 10px 22px rgba(0,0,0,.35);border:1px solid var(--border-primary);overflow:hidden}.account-card{display:flex;align-items:center;padding:14px 14px;border-bottom:1px solid rgba(31,51,86,.55);transition:.2s;cursor:pointer;position:relative}.account-card:hover{background:rgba(17,31,53,.35)}.account-card:last-child{border-bottom:none}.account-avatar{width:46px;height:46px;border-radius:50%;margin-left:12px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(17,31,53,.65);border:1px solid var(--border-primary);overflow:hidden;position:relative}.account-avatar img{width:100%;height:100%;object-fit:cover;display:block}.rank-badge{position:absolute;bottom:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-weight:1000;font-size:11px;border:2px solid rgba(11,18,32,.9);box-shadow:0 10px 18px rgba(0,0,0,.35);direction:ltr}.r1{background:linear-gradient(135deg,#ffd54f,#ff8f00);color:#2a1400}.r2{background:linear-gradient(135deg,#e0e0e0,#9e9e9e);color:#111}.r3{background:linear-gradient(135deg,#ffccbc,#bf360c);color:#220900}.r4{background:linear-gradient(135deg,#90caf9,#1976d2);color:#001f3f}.account-info{flex:1;min-width:0}.account-name{font-size:14px;font-weight:1000;color:#fff;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account-trades{font-size:12px;color:var(--text-secondary);font-weight:900}.account-trades-count{color:#fff;font-weight:1000;direction:ltr}.account-stats{text-align:left;min-width:120px}.account-profit{font-size:15px;font-weight:1000;color:var(--accent-green);margin-bottom:6px;direction:ltr}.account-operations{font-size:11px;color:var(--text-secondary);font-weight:900}.account-percentage{color:#fff;font-weight:1000;direction:ltr}.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:62px;display:flex;justify-content:space-around;align-items:center;background:var(--bg-primary);border-top:1.1px solid var(--border-primary);z-index:2000}.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2px;cursor:pointer;flex:1;height:100%;transition:.2s}.nav-item:hover{background:rgba(255,255,255,.03)}.nav-icon{width:24.2px;height:24.2px;object-fit:contain;filter:contrast(1.25) brightness(1.2) drop-shadow(0 6.6px 13.2px rgba(0,0,0,.35))}.nav-item.active .nav-icon{filter:contrast(1.35) brightness(1.28) drop-shadow(0 0 7.7px rgba(255,255,255,.25))}.details-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;align-items:center;justify-content:center;backdrop-filter:blur(10px)}.details-modal.active{display:flex}.details-content{background:linear-gradient(145deg,#2a3243 0%,#252d3f 100%);border-radius:25px;padding:30px 20px 20px;width:90%;max-width:420px;animation:zoomIn .28s ease;box-shadow:0 20px 80px rgba(0,0,0,.7);border:2px solid #323a4d;position:relative}@keyframes zoomIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}.details-close-small{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:rgba(231,76,60,.9);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;z-index:10}.details-close-small:hover{background:#c0392b;transform:scale(1.1)}.details-avatar{width:100px;height:100px;border-radius:50%;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:60px;background:#1a1f2e;border:4px solid #667eea;box-shadow:0 10px 30px rgba(102,126,234,.3);overflow:hidden}.details-avatar img{width:100%;height:100%;object-fit:cover}.details-name{text-align:center;font-size:22px;font-weight:700;color:#fff;margin-bottom:10px}.details-id{text-align:center;font-size:12px;color:#90a4ff;margin-bottom:20px;direction:ltr;font-weight:900}.details-info{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info-row{background:#1a1f2e;padding:12px;border-radius:12px;display:flex;flex-direction:column;gap:6px;border-right:3px solid #667eea}.info-label{font-size:11px;color:#a8b3cf;font-weight:500}.info-value{font-size:15px;font-weight:700;color:#fff}.info-value.profit{color:#00c853;direction:ltr}.info-value.max{color:#4caf50;direction:ltr}.info-value.min{color:#ff9800;direction:ltr}.info-value.percentage{color:#2196f3}#navSk{position:fixed;inset:0;z-index:99999;display:none;background:var(--bg-primary)}#navSk.on{display:block}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.10);padding:10px 12px;border-radius:12px;color:#fff;font-size:12px;z-index:5000;display:none;backdrop-filter:blur(8px)}.toast.show{display:block;animation:fade .18s ease}@keyframes fade{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div id="navSk"></div>
<div class="top-bar">
<div class="balance" id="balanceBox">
<div class="balanceMain">
<img src="" class="flag-icon" id="topAccIcon">
<span class="balance-amount" id="balTxt">$0.00</span>
</div>
<svg class="arrow-down" viewBox="0 0 24 24" fill="#888"><path d="M7 10l5 5 5-5z"></path></svg>
<div class="accMenu" id="accMenu">
<div class="accSwitch">
<button class="accSwitchBtn live" data-acc="real">LIVE</button>
<button class="accSwitchBtn demo active" data-acc="demo">Demo</button>
</div>
<div class="accItem" data-type="real">
<div class="accL">
<img class="accIco" src="https://flagcdn.com/w40/us.png" alt="">
<div class="accAmt" id="realAmt">$0.00</div>
</div>
</div>
<div class="accItem active" data-type="demo">
<div class="accL">
<img class="accIco" src="https://cdn-icons-png.flaticon.com/128/1344/1344761.png" alt="">
<div class="accAmt" id="demoAmt">$10,000.00</div>
</div>
</div>
<button class="refillBtn" id="refillBtn">🔄 Refill Demo Account</button>
</div>
</div>
<div class="top-icons">
<div class="icon-box green-box" id="goDeposit">
<img src="https://cdn-icons-png.flaticon.com/128/10167/10167706.png">
</div>
<div class="icon-box" id="goProfile">
<img src="https://cdn-icons-png.flaticon.com/128/18921/18921105.png" id="profileAvatar">
</div>
</div>
</div>
<div class="container">
<div class="header">
<h1>التداول الاجتماعي</h1>
<div class="sub">
<div class="subTitle">أعلى اللاعبين خلال 24 ساعة الأخيرة</div>
</div>
</div>
<div class="social-label">تداول حقيقي</div>
<div class="accounts-list" id="accountsList">
<div style="text-align:center;padding:40px;color:var(--text-secondary);font-weight:1000">جاري التحميل...</div>
</div>
</div>
<div class="details-modal" id="detailsModal">
<div class="details-content">
<button class="details-close-small" id="closeDetailsSmall">×</button>
<div class="details-avatar" id="detailsAvatar">👤</div>
<div class="details-name" id="detailsName">اسم الحساب</div>
<div class="details-id" id="detailsId">ID: 000000000</div>
<div class="details-info">
<div class="info-row">
<span class="info-label">عدد التداولات</span>
<span class="info-value" id="detailsTrades">0</span>
</div>
<div class="info-row">
<span class="info-label">الربح الإجمالي</span>
<span class="info-value profit" id="detailsProfit">$0.00</span>
</div>
<div class="info-row">
<span class="info-label">أكبر مبلغ</span>
<span class="info-value max" id="detailsMax">$0.00</span>
</div>
<div class="info-row">
<span class="info-label">أصغر مبلغ</span>
<span class="info-value min" id="detailsMin">$0.00</span>
</div>
<div class="info-row" style="grid-column:1/3">
<span class="info-label">نسبة الربح</span>
<span class="info-value percentage" id="detailsRate">0%</span>
</div>
</div>
</div>
</div>
<div class="bottom-nav">
<div class="nav-item" data-nav="chart">
<img class="nav-icon" src="https://cdn-icons-png.flaticon.com/128/893/893214.png">
</div>
<div class="nav-item" data-nav="order">
<img class="nav-icon" src="https://cdn-icons-png.flaticon.com/128/8490/8490818.png">
</div>
<div class="nav-item" data-nav="notif">
<img class="nav-icon" src="https://cdn-icons-png.flaticon.com/128/9783/9783934.png">
</div>
<div class="nav-item" data-nav="settings">
<img class="nav-icon" src="https://cdn-icons-png.flaticon.com/128/14026/14026955.png">
</div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
import {initializeApp as iA} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {getAuth as gA, onAuthStateChanged as oASC, signInAnonymously as sIA} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {getFirestore as gFS, collection as col, onSnapshot as oS, addDoc, doc as d, setDoc as sD, getDoc as gD, updateDoc as uD} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
const $=id=>document.getElementById(id);
const app=iA({apiKey:"AIzaSyBOUqLixfphg3b8hajc4hkwV-VJmldGBVw",authDomain:"randers-c640b.firebaseapp.com",projectId:"randers-c640b",storageBucket:"randers-c640b.firebasestorage.app",messagingSenderId:"391496092929",appId:"1:391496092929:web:58208b4eb3e6f9a8571f00"});
const db=gFS(app);
const auth=gA(app);
const accountsRef=col(db,"accounts_data");
let currentUser=null;
let activeAccType="demo";
let ALL=[];
const toast=t=>{const x=$("toast");x.textContent=t;x.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(()=>x.classList.remove("show"),1400)};
const fmt=n=>(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const rankBadge=i=>{const r={0:"r1",1:"r2",2:"r3"};return `<span class="rank-badge ${r[i]||"r4"}">${i+1}</span>`};
const navSk=$("navSk");
const showNavSk=()=>navSk&&navSk.classList.add("on");
const hideNavSk=()=>navSk&&navSk.classList.remove("on");
addEventListener("pageshow",()=>hideNavSk());
addEventListener("load",()=>hideNavSk());
const go=u=>{showNavSk();setTimeout(()=>location.href=u,0)};
const updateTopIcon=()=>{const icon=$("topAccIcon");icon.src=activeAccType==="real"?"https://flagcdn.com/w40/us.png":"https://cdn-icons-png.flaticon.com/128/1344/1344761.png"};
const getBalKey=t=>t==="real"?"balance":"balanceDemo";
const updateBalanceUI=async()=>{if(!currentUser){balTxt.textContent=activeAccType==="real"?realAmt.textContent:demoAmt.textContent;updateTopIcon();return}try{const snap=await gD(d(db,"users",currentUser.uid));if(snap.exists()){const data=snap.data();realAmt.textContent="$"+(+data.balance||0).toFixed(2);demoAmt.textContent="$"+(+data.balanceDemo||10000).toFixed(2);balTxt.textContent=activeAccType==="real"?realAmt.textContent:demoAmt.textContent;updateTopIcon()}}catch(e){console.error(e)}};
const syncBalance=async(type,val)=>{if(!currentUser)return;try{const field=getBalKey(type);await uD(d(db,"users",currentUser.uid),{[field]:val});await updateBalanceUI()}catch(e){console.error(e)}};
const getBalance=()=>{if(!currentUser)return 0;const k=getBalKey(activeAccType);return parseFloat(localStorage.getItem(k)||(activeAccType==="real"?"0":"10000"))};
const setBalance=val=>{const k=getBalKey(activeAccType);localStorage.setItem(k,String(val));syncBalance(activeAccType,val);(activeAccType==="real"?realAmt:demoAmt).textContent="$"+(+val).toFixed(2);balTxt.textContent="$"+(+val).toFixed(2);updateBalanceUI()};
balanceBox.onclick=e=>{if(e.target.closest(".accMenu"))return;e.stopPropagation();accMenu.classList.toggle("show");balanceBox.classList.toggle("open")};
document.addEventListener("click",e=>{if(!e.target.closest("#balanceBox")){accMenu.classList.remove("show");balanceBox.classList.remove("open")}});
const fastSwitch=t=>{activeAccType=t;document.querySelectorAll(".accSwitchBtn").forEach(x=>x.classList.toggle("active",x.dataset.acc===t));document.querySelectorAll(".accItem").forEach(x=>x.classList.toggle("active",x.dataset.type===t));balTxt.textContent=t==="real"?realAmt.textContent:demoAmt.textContent;updateTopIcon()};
document.querySelectorAll(".accSwitchBtn").forEach(btn=>btn.onclick=function(){fastSwitch(this.dataset.acc)});
document.querySelectorAll(".accItem").forEach(it=>it.onclick=function(){fastSwitch(this.dataset.type)});
refillBtn.onclick=async()=>{if(activeAccType==="real")return;setBalance(10000);refillBtn.textContent="✅";setTimeout(()=>refillBtn.textContent="🔄 Refill Demo Account",900)};
const loadUserAvatar=async()=>{if(!currentUser)return;try{const snap=await gD(d(db,"users",currentUser.uid));if(snap.exists()){const data=snap.data();if(data.avatar&&data.avatar.trim()){$("profileAvatar").src=data.avatar}else{await uD(d(db,"users",currentUser.uid),{avatar:"https://cdn-icons-png.flaticon.com/128/18921/18921105.png"});$("profileAvatar").src="https://cdn-icons-png.flaticon.com/128/18921/18921105.png"}}else{await sD(d(db,"users",currentUser.uid),{avatar:"https://cdn-icons-png.flaticon.com/128/18921/18921105.png"},{merge:true});$("profileAvatar").src="https://cdn-icons-png.flaticon.com/128/18921/18921105.png"}}catch(e){console.error(e)}};
$("goProfile").onclick=()=>go("profile.html");
$("goDeposit").onclick=()=>go("deposit.html");
function displayAccounts(list){const wrap=$("accountsList");if(!list.length){wrap.innerHTML=`<div style="text-align:center;padding:40px;color:var(--text-secondary);font-weight:1000">لا توجد حسابات</div>`;return}wrap.innerHTML=list.map((a,i)=>{const av=a.imageUrl?`<img src="${a.imageUrl}" onerror="this.parentElement.textContent='❌'">`:(a.icon||"👤");return `<div class="account-card" data-id="${a.id}"><div class="account-avatar">${av}${rankBadge(i)}</div><div class="account-info"><div class="account-name">${esc(a.name)}</div><div class="account-trades">عدد عمليات التداول: <span class="account-trades-count">${a.tradesCount||0}</span></div></div><div class="account-stats"><div class="account-profit">+$${fmt(a.profitAmount)}</div><div class="account-operations">نسبة الربح: <span class="account-percentage">${a.profitRate||0}%</span></div></div></div>`}).join("");document.querySelectorAll(".account-card").forEach(card=>{const id=card.dataset.id;card.addEventListener("click",function(){const a=ALL.find(x=>x.id===id);if(a)showDetails(a)})})}
function showDetails(a){const dv=$("detailsAvatar");dv.innerHTML=a.imageUrl?`<img src="${a.imageUrl}" onerror="this.parentElement.innerHTML='❌'">`:(a.icon||"👤");$("detailsName").textContent=a.name||"—";$("detailsId").textContent="ID: "+String(a.accountId||"000000000");$("detailsTrades").textContent=a.tradesCount||0;$("detailsProfit").textContent="+$"+fmt(a.profitAmount);$("detailsMax").textContent="$"+fmt(a.maxAmount);$("detailsMin").textContent="$"+fmt(a.minAmount);$("detailsRate").textContent=(a.profitRate||0)+"%";$("detailsModal").classList.add("active")}
$("closeDetailsSmall").addEventListener("click",()=>{$("detailsModal").classList.remove("active")});
$("detailsModal").addEventListener("click",e=>{if(e.target.id==="detailsModal"){$("detailsModal").classList.remove("active")}});
oS(accountsRef,snap=>{ALL=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(+b.profitAmount||0)-(+a.profitAmount||0));displayAccounts(ALL)});
document.querySelectorAll(".nav-item").forEach(item=>item.addEventListener("click",function(){document.querySelectorAll(".nav-item").forEach(i=>i.classList.remove("active"));this.classList.add("active");const page=this.dataset.nav;if(page==="chart"){window.location.href="home.html"}else if(page==="order"){window.location.href="notifications.html"}else if(page==="notif"){window.location.href="notifications.html"}else if(page==="settings"){window.location.href="settings.html"}}));
oASC(auth,async user=>{if(user){currentUser=user}else{try{currentUser=(await sIA(auth)).user}catch(e){console.error(e)}}if(currentUser){try{const userRef=d(db,"users",currentUser.uid);const snap=await gD(userRef);if(snap.exists()){await loadUserAvatar()}else{await sD(userRef,{balance:0,balanceDemo:10000,avatar:"https://cdn-icons-png.flaticon.com/128/18921/18921105.png",createdAt:Date.now()});await loadUserAvatar()}await updateBalanceUI()}catch(e){console.error(e)}}});
updateBalanceUI();
updateTopIcon();
</script>
</body>
</html>
