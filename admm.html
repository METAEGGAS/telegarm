<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 VENOX - لوحة التحكم</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0a0a14; color: #e2e8f0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 20px 28px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #f97316, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .subtitle { color: #94a3b8; font-size: 14px; }
        .badge { padding: 6px 16px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(249,115,22,0.3); }
        .badge-connected { background: rgba(34,197,94,0.15); color: #4ade80; border-color: rgba(34,197,94,0.3); }
        .badge-error { background: rgba(239,68,68,0.15); color: #f87171; border-color: rgba(239,68,68,0.3); }
        
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h3 { color: #f97316; margin-bottom: 16px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 4px; }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus { border-color: #f97316; }
        
        .btn { padding: 10px 22px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: #f97316; color: #fff; }
        .btn-primary:hover { background: #ea580c; transform: translateY(-2px); }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-success:hover { background: #16a34a; transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        
        .result-box {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            color: #94a3b8;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 250px;
            overflow: auto;
            margin-top: 12px;
        }
        .result-box.success { border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
        .result-box.error { border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 24px; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 500; z-index: 999; animation: slideUp 0.3s ease; max-width: 450px; }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>🔥 VENOX · لوحة التحكم</h1>
            <div class="subtitle">إنشاء حسابات + عرض المستخدمين</div>
        </div>
        <span class="badge badge-connected" id="statusBadge">✅ متصل</span>
    </div>

    <div class="grid-2">
        <!-- ===== إنشاء حساب ===== -->
        <div class="card">
            <h3>🔐 إنشاء حساب جديد</h3>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="signupEmail" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="signupPassword" placeholder="••••••••" value="Test123!">
            </div>
            <button class="btn btn-success" onclick="createAccount()">🚀 إنشاء حساب</button>
            <div id="signupResult" class="result-box">⏳ انتظر...</div>
        </div>

        <!-- ===== عرض المستخدمين ===== -->
        <div class="card">
            <h3>👥 المستخدمين</h3>
            <button class="btn btn-primary" onclick="loadUsers()">📥 تحميل المستخدمين</button>
            <button class="btn btn-danger" onclick="clearAll()" style="margin-right:10px;">🗑️ مسح الكل</button>
            <div id="usersResult" class="result-box">⏳ اضغط "تحميل"</div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 🔥 Firebase Config
// ============================================================
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCV-SRgZ8Hhw6VXE0Zl0Ob0P5LPCApZPVU",
    authDomain: "venox-ffe5c.firebaseapp.com",
    projectId: "venox-ffe5c",
    storageBucket: "venox-ffe5c.firebasestorage.app",
    messagingSenderId: "482650740134",
    appId: "1:482650740134:web:416bdda6dc7f7611c42b67"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

// ============================================================
// 📌 TOAST
// ============================================================
function showToast(msg, type = 'info') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

// ============================================================
// 🔐 إنشاء حساب
// ============================================================
async function createAccount() {
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value.trim();
    const result = document.getElementById('signupResult');
    
    if (!email || !password) {
        result.textContent = '❌ أدخل البريد وكلمة المرور';
        result.className = 'result-box error';
        return;
    }
    
    result.textContent = '⏳ جاري إنشاء الحساب...';
    result.className = 'result-box';
    
    try {
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        result.textContent = `✅ تم إنشاء الحساب!\nUID: ${userCred.user.uid}\nالبريد: ${userCred.user.email}`;
        result.className = 'result-box success';
        showToast('✅ تم إنشاء الحساب', 'success');
        document.getElementById('statusBadge').className = 'badge badge-connected';
    } catch (error) {
        result.textContent = `❌ فشل: ${error.message}`;
        result.className = 'result-box error';
        showToast(`❌ ${error.message}`, 'error');
        document.getElementById('statusBadge').className = 'badge badge-error';
    }
}

// ============================================================
// 👥 تحميل المستخدمين
// ============================================================
async function loadUsers() {
    const result = document.getElementById('usersResult');
    result.textContent = '⏳ جاري التحميل...';
    result.className = 'result-box';
    
    try {
        const snapshot = await db.collection('users').get();
        let users = [];
        snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
        
        if (users.length === 0) {
            result.textContent = '📭 لا يوجد مستخدمين (أو القواعد تمنع القراءة)';
            result.className = 'result-box';
            return;
        }
        
        let text = `👥 ${users.length} مستخدم\n${'='.repeat(40)}\n`;
        users.forEach((u, i) => {
            text += `${i+1}. ${u.email || '—'} | ${u.role || 'user'} | ${u.uid || u.id}\n`;
        });
        result.textContent = text;
        result.className = 'result-box success';
    } catch (error) {
        result.textContent = `❌ فشل: ${error.message}`;
        result.className = 'result-box error';
        showToast(`❌ ${error.message}`, 'error');
    }
}

// ============================================================
// 🗑️ مسح كل شيء
// ============================================================
function clearAll() {
    document.getElementById('usersResult').textContent = '⏳ اضغط "تحميل"';
    document.getElementById('usersResult').className = 'result-box';
    document.getElementById('signupResult').textContent = '⏳ انتظر...';
    document.getElementById('signupResult').className = 'result-box';
    document.getElementById('signupEmail').value = '';
    document.getElementById('signupPassword').value = 'Test123!';
    showToast('🗑️ تم المسح', 'info');
}
</script>

</body>
</html>
