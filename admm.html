<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 VENOX - فحص Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0a0a14; color: #e2e8f0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 16px; padding: 20px 28px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.05); }
        .header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #f97316, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; background: #f97316; color: #fff; margin: 5px; }
        .btn:hover { background: #ea580c; transform: translateY(-2px); }
        .btn-success { background: #22c55e; }
        .btn-success:hover { background: #16a34a; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }
        .result { background: rgba(0,0,0,0.3); padding: 16px; border-radius: 10px; margin-top: 12px; font-family: monospace; font-size: 13px; color: #94a3b8; white-space: pre-wrap; word-break: break-all; max-height: 500px; overflow: auto; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-success { background: rgba(34,197,94,0.2); color: #4ade80; }
        .badge-error { background: rgba(239,68,68,0.2); color: #f87171; }
        .badge-info { background: rgba(59,130,246,0.2); color: #60a5fa; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔥 VENOX · Firestore Scanner</h1>
        <p style="color:#94a3b8;font-size:14px;">جرب مجموعات مختلفة قد تكون مفتوحة للقراءة</p>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
        <button class="btn" onclick="scanCollection('users')">👥 users</button>
        <button class="btn" onclick="scanCollection('deposits')">📥 deposits</button>
        <button class="btn" onclick="scanCollection('withdrawals')">📤 withdrawals</button>
        <button class="btn" onclick="scanCollection('transactions')">💱 transactions</button>
        <button class="btn" onclick="scanCollection('investments')">📈 investments</button>
        <button class="btn btn-success" onclick="scanAll()">🔍 فحص الكل</button>
        <button class="btn btn-secondary" onclick="document.getElementById('output').textContent=''">🗑️ مسح</button>
    </div>

    <div id="output" class="result">⏳ اضغط على أي زر لبدء الفحص...</div>
</div>

<script>
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCV-SRgZ8Hhw6VXE0Zl0Ob0P5LPCApZPVU",
    authDomain: "venox-ffe5c.firebaseapp.com",
    projectId: "venox-ffe5c",
    storageBucket: "venox-ffe5c.firebasestorage.app",
    messagingSenderId: "482650740134",
    appId: "1:482650740134:web:416bdda6dc7f7611c42b67"
};

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

const output = document.getElementById('output');

function log(msg, type = 'info') {
    const colors = { success: '#4ade80', error: '#f87171', info: '#60a5fa' };
    const badges = { success: '✅', error: '❌', info: 'ℹ️' };
    output.innerHTML += `<span style="color:${colors[type]}">${badges[type]} ${msg}</span>\n`;
    output.scrollTop = output.scrollHeight;
}

async function scanCollection(name) {
    log(`⏳ جاري فحص مجموعة "${name}"...`, 'info');
    try {
        const snapshot = await db.collection(name).limit(5).get();
        if (snapshot.empty) {
            log(`📭 مجموعة "${name}" فارغة`, 'info');
            return;
        }
        log(`✅ مجموعة "${name}" مفتوحة! (${snapshot.size} وثيقة)`, 'success');
        snapshot.forEach(doc => {
            log(`   📄 ${doc.id}: ${JSON.stringify(doc.data(), null, 2).substring(0, 200)}...`, 'info');
        });
    } catch (error) {
        log(`❌ مجموعة "${name}" ممنوعة: ${error.message}`, 'error');
    }
}

async function scanAll() {
    output.textContent = '';
    log('🚀 بدء الفحص الشامل...', 'info');
    const collections = ['users', 'deposits', 'withdrawals', 'transactions', 'investments', 'profiles', 'settings', 'trades', 'orders', 'payments'];
    for (const name of collections) {
        await scanCollection(name);
    }
    log('✅ انتهى الفحص!', 'success');
}

// تحميل تلقائي
window.onload = function() {
    output.textContent = '🔥 جاهز! اضغط على أي زر لبدء الفحص.\n';
};
</script>

</body>
</html>
