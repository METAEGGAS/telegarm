<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 VENOX - استكشاف المستخدمين</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0a0a14; color: #e2e8f0; min-height: 100vh; padding: 16px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 16px; padding: 20px 28px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #f97316, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .subtitle { color: #94a3b8; font-size: 14px; }
        .badge { padding: 6px 16px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(249,115,22,0.3); }
        .badge-connected { background: rgba(34,197,94,0.15); color: #4ade80; border-color: rgba(34,197,94,0.3); }
        .badge-error { background: rgba(239,68,68,0.15); color: #f87171; border-color: rgba(239,68,68,0.3); }
        
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .card h3 { color: #f97316; margin-bottom: 12px; }
        .card .note { color: #94a3b8; font-size: 12px; margin-bottom: 10px; }
        
        .btn { padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; margin: 3px; }
        .btn-primary { background: #f97316; color: #fff; }
        .btn-primary:hover { background: #ea580c; transform: translateY(-2px); }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-success:hover { background: #16a34a; transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .btn-info { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
        .btn-info:hover { background: rgba(59,130,246,0.3); transform: translateY(-2px); }
        
        .result-box { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #94a3b8; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; margin-top: 8px; }
        .result-box.success { border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
        .result-box.error { border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
        .result-box.warning { border: 1px solid rgba(249,115,22,0.3); color: #f97316; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; color: #94a3b8; font-size: 12px; margin-bottom: 3px; }
        .form-group input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #e2e8f0; font-size: 13px; outline: none; }
        .form-group input:focus { border-color: #f97316; }
        
        .uid-display { background: rgba(249,115,22,0.1); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(249,115,22,0.2); color: #f97316; font-family: monospace; font-size: 12px; display: inline-block; margin-bottom: 6px; }
        .token-display { background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(59,130,246,0.2); color: #60a5fa; font-family: monospace; font-size: 11px; display: block; word-break: break-all; max-height: 60px; overflow: auto; margin-bottom: 6px; }
        
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; color: #fff; font-size: 13px; z-index: 999; animation: slideUp 0.3s ease; max-width: 400px; }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>🔥 VENOX · استكشاف المستخدمين</h1>
            <div class="subtitle">محاولة قراءة بيانات المستخدمين الآخرين</div>
        </div>
        <span class="badge badge-connected" id="statusBadge">✅ جاهز</span>
    </div>

    <!-- ===== LOGIN ===== -->
    <div class="card">
        <h3>🔑 تسجيل الدخول</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <input type="email" id="loginEmail" placeholder="البريد" style="flex:1;padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#e2e8f0;min-width:150px;">
            <input type="password" id="loginPassword" placeholder="كلمة المرور" style="flex:1;padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#e2e8f0;min-width:120px;" value="Test123!">
            <button class="btn btn-primary" onclick="login()">🔓 تسجيل</button>
        </div>
        <div id="loginResult" class="result-box">⏳ انتظر...</div>
        <div id="uidDisplay" class="uid-display" style="display:none;"></div>
        <div id="tokenDisplay" class="token-display" style="display:none;"></div>
    </div>

    <!-- ===== GRID ===== -->
    <div class="grid-2">
        <!-- UIDs -->
        <div class="card">
            <h3>🆔 معرفات المستخدمين</h3>
            <div class="note">من مجموعة taskCompletions</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">
                <button class="btn btn-secondary" onclick="setUid('3NMRA9D5DEYPTOU')">3NMRA9...</button>
                <button class="btn btn-secondary" onclick="setUid('4HNWIQMDKXTGYRO')">4HNWIQ...</button>
                <button class="btn btn-secondary" onclick="setUid('560VHAUTASUFFAJ')">560VHA...</button>
                <button class="btn btn-secondary" onclick="setUid('6CNWZD07IQQWMIO')">6CNWZD...</button>
                <button class="btn btn-secondary" onclick="setUid('A2VUBNNHLFSXS9L')">A2VUBN...</button>
                <button class="btn btn-secondary" onclick="setUid('B8HZGGZGCCFUGZP')">B8HZGG...</button>
                <button class="btn btn-secondary" onclick="setUid('EEB31SYD25QFLFY')">EEB31S...</button>
                <button class="btn btn-secondary" onclick="setUid('RZNCOWJNL9IDATJ')">RZNCOW...</button>
                <button class="btn btn-secondary" onclick="setUid('ZQXWWJWUMTCEIFC')">ZQXWWJ...</button>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <input type="text" id="targetUid" placeholder="أدخل UID" style="flex:2;padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#e2e8f0;min-width:150px;font-family:monospace;">
                <button class="btn btn-info" onclick="readUser()">👤 قراءة</button>
                <button class="btn btn-secondary" onclick="clearResult('userResult')">🗑️ مسح</button>
            </div>
            <div id="userResult" class="result-box">⏳ أدخل UID واقرأ</div>
        </div>

        <!-- Bulk Scan -->
        <div class="card">
            <h3>🔍 فحص شامل</h3>
            <div class="note">محاولة قراءة جميع المستخدمين</div>
            <button class="btn btn-info" onclick="scanAllUsers()">👥 كل المستخدمين</button>
            <button class="btn btn-info" onclick="scanTaskCompletions()">📋 كل المهام</button>
            <button class="btn btn-secondary" onclick="clearResult('bulkResult')">🗑️ مسح</button>
            <div id="bulkResult" class="result-box">⏳ اضغط زر...</div>
        </div>
    </div>

    <!-- ===== FIRESTORE ===== -->
    <div class="card">
        <h3>📄 Firestore - مجموعات مفتوحة</h3>
        <button class="btn btn-info" onclick="fsRead('taskCompletions')">📋 taskCompletions</button>
        <button class="btn btn-info" onclick="fsRead('tasks')">📌 tasks</button>
        <button class="btn btn-info" onclick="fsReadAll()">🔍 كل المجموعات</button>
        <button class="btn btn-secondary" onclick="clearResult('fsResult')">🗑️ مسح</button>
        <div id="fsResult" class="result-box">⏳ اضغط زر...</div>
    </div>
</div>

<script>
// ============================================================
// 🔥 Firebase Config
// ============================================================
const API_KEY = "AIzaSyCV-SRgZ8Hhw6VXE0Zl0Ob0P5LPCApZPVU";
const PROJECT_ID = "venox-ffe5c";

const FIREBASE_CONFIG = {
    apiKey: API_KEY,
    authDomain: "venox-ffe5c.firebaseapp.com",
    projectId: PROJECT_ID,
    storageBucket: "venox-ffe5c.firebasestorage.app",
    messagingSenderId: "482650740134",
    appId: "1:482650740134:web:416bdda6dc7f7611c42b67"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUid = '';
let currentToken = '';

// ============================================================
// 📌 HELPERS
// ============================================================
function showToast(msg, type = 'info') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

function setResult(id, text, type = '') {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'result-box' + (type ? ' ' + type : '');
}

function clearResult(id) {
    document.getElementById(id).textContent = '⏳ اضغط زر...';
    document.getElementById(id).className = 'result-box';
}

// ============================================================
// 🔑 LOGIN
// ============================================================
async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const result = document.getElementById('loginResult');
    
    if (!email || !password) {
        setResult('loginResult', '❌ أدخل البريد وكلمة المرور', 'error');
        return;
    }
    
    setResult('loginResult', '⏳ جاري...', '');
    
    try {
        const userCred = await auth.signInWithEmailAndPassword(email, password);
        const idToken = await userCred.user.getIdToken();
        currentUid = userCred.user.uid;
        currentToken = idToken;
        
        setResult('loginResult', `✅ تم تسجيل الدخول!\nUID: ${currentUid}\nالبريد: ${userCred.user.email}`, 'success');
        
        document.getElementById('uidDisplay').style.display = 'block';
        document.getElementById('uidDisplay').textContent = `🆔 UID: ${currentUid}`;
        document.getElementById('tokenDisplay').style.display = 'block';
        document.getElementById('tokenDisplay').textContent = `🔑 Token: ${currentToken.substring(0, 80)}...`;
        
        showToast('✅ تم تسجيل الدخول', 'success');
        document.getElementById('statusBadge').className = 'badge badge-connected';
    } catch (error) {
        setResult('loginResult', `❌ فشل: ${error.message}`, 'error');
        showToast(`❌ ${error.message}`, 'error');
        document.getElementById('statusBadge').className = 'badge badge-error';
    }
}

// ============================================================
// 👤 READ USER
// ============================================================
async function readUser() {
    const targetUid = document.getElementById('targetUid').value.trim();
    const result = document.getElementById('userResult');
    
    if (!targetUid) {
        setResult('userResult', '❌ أدخل UID', 'error');
        return;
    }
    if (!currentUid) {
        setResult('userResult', '❌ سجل دخول أولاً', 'error');
        return;
    }
    
    setResult('userResult', `⏳ جاري قراءة ${targetUid}...`, '');
    let output = `🎯 المستخدم: ${targetUid}\n${'='.repeat(40)}\n`;
    
    // محاولة users
    try {
        const doc = await db.collection('users').doc(targetUid).get();
        if (doc.exists) {
            output += `✅ users:\n${JSON.stringify(doc.data(), null, 2)}\n\n`;
        } else {
            output += `📭 users: لا توجد بيانات\n\n`;
        }
    } catch(e) {
        output += `❌ users: ${e.message}\n\n`;
    }
    
    // محاولة profiles
    try {
        const doc = await db.collection('profiles').doc(targetUid).get();
        if (doc.exists) {
            output += `✅ profiles:\n${JSON.stringify(doc.data(), null, 2)}\n\n`;
        } else {
            output += `📭 profiles: لا توجد بيانات\n\n`;
        }
    } catch(e) {
        output += `❌ profiles: ${e.message}\n\n`;
    }
    
    setResult('userResult', output, 'success');
}

function setUid(uid) {
    document.getElementById('targetUid').value = uid;
    readUser();
}

// ============================================================
// 🔍 BULK SCAN
// ============================================================
async function scanAllUsers() {
    const result = document.getElementById('bulkResult');
    if (!currentUid) { setResult('bulkResult', '❌ سجل دخول أولاً', 'error'); return; }
    setResult('bulkResult', '⏳ جاري فحص المستخدمين...', '');
    
    const uids = ['3NMRA9D5DEYPTOU', '4HNWIQMDKXTGYRO', '560VHAUTASUFFAJ', '6CNWZD07IQQWMIO', 'A2VUBNNHLFSXS9L', 'B8HZGGZGCCFUGZP', 'EEB31SYD25QFLFY', 'RZNCOWJNL9IDATJ', 'ZQXWWJWUMTCEIFC'];
    let output = '👥 فحص المستخدمين:\n' + '='.repeat(40) + '\n';
    let found = 0;
    
    for (const uid of uids) {
        try {
            const doc = await db.collection('users').doc(uid).get();
            if (doc.exists) {
                found++;
                output += `✅ ${uid}:\n${JSON.stringify(doc.data(), null, 2)}\n\n`;
            }
        } catch(e) {
            output += `❌ ${uid}: ${e.message}\n`;
        }
    }
    
    output += `\n📊 تم العثور على ${found} مستخدم`;
    setResult('bulkResult', output, found > 0 ? 'success' : 'warning');
}

async function scanTaskCompletions() {
    const result = document.getElementById('bulkResult');
    setResult('bulkResult', '⏳ جاري قراءة المهام...', '');
    try {
        const snap = await db.collection('taskCompletions').get();
        let output = `📋 المهام (${snap.size}):\n${'='.repeat(40)}\n`;
        const users = new Set();
        snap.forEach(doc => {
            const data = doc.data();
            users.add(data.userId);
            output += `  ${JSON.stringify(data)}\n`;
        });
        output += `\n👥 عدد المستخدمين: ${users.size}`;
        setResult('bulkResult', output, 'success');
    } catch(e) {
        setResult('bulkResult', `❌ ${e.message}`, 'error');
    }
}

// ============================================================
// 📄 FIRESTORE
// ============================================================
async function fsRead(collection) {
    const result = document.getElementById('fsResult');
    if (!currentUid) { setResult('fsResult', '❌ سجل دخول أولاً', 'error'); return; }
    setResult('fsResult', `⏳ جاري قراءة ${collection}...`, '');
    try {
        const snap = await db.collection(collection).limit(10).get();
        if (snap.empty) {
            setResult('fsResult', `📭 ${collection}: فارغ`, 'warning');
        } else {
            let output = `✅ ${collection} (${snap.size}):\n`;
            snap.forEach(doc => {
                output += `  ${JSON.stringify(doc.data())}\n`;
            });
            setResult('fsResult', output, 'success');
        }
    } catch(e) {
        setResult('fsResult', `❌ ${collection}: ${e.message}`, 'error');
    }
}

async function fsReadAll() {
    const result = document.getElementById('fsResult');
    if (!currentUid) { setResult('fsResult', '❌ سجل دخول أولاً', 'error'); return; }
    setResult('fsResult', '⏳ جاري فحص الكل...', '');
    const collections = ['users', 'profiles', 'deposits', 'tasks', 'taskCompletions', 'referrals', 'notifications'];
    let output = '';
    for (const col of collections) {
        try {
            const snap = await db.collection(col).limit(2).get();
            if (!snap.empty) {
                output += `✅ ${col}: ${snap.size}\n`;
            } else {
                output += `📭 ${col}: فارغ\n`;
            }
        } catch(e) {
            output += `❌ ${col}: ${e.message}\n`;
        }
    }
    setResult('fsResult', output || '📭 لا توجد نتائج', 'success');
}
</script>

</body>
</html>
