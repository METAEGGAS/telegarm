<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF‑8">
  <title>Supabase Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { margin: 5px 0; padding: 8px; width: 100%; }
    .log { border: 1px solid #ccc; padding: 8px; height: 100px; overflow:auto }
  </style>
</head>
<body>

<h2>Supabase Authentication & Candles</h2>

<h3>تسجيل / إنشاء حساب</h3>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="signUp()">إنشاء حساب</button>
<button onclick="signIn()">تسجيل دخول</button>
<div id="authLog" class="log"></div>

<hr>

<h3>إضافة شمعة</h3>
<input type="text" id="pair" placeholder="Pair (مثال: BTC/USD)">
<input type="number" id="open" placeholder="open">
<input type="number" id="high" placeholder="high">
<input type="number" id="low" placeholder="low">
<input type="number" id="close" placeholder="close">
<input type="number" id="timestamp" placeholder="timestamp">
<button onclick="addCandle()">أرسل شمعة</button>
<div id="dataLog" class="log"></div>

<script>
const supabase = supabase.createClient(
  "https://jgcbhbqofimmgwzzoia.supabase.co",
  "sb_publishable_mkNhancggR91jzTuzFryJQ_mQgHS0Qm"
);

function log(elem, msg) {
  elem.innerHTML += msg + "<br>";
  elem.scrollTop = elem.scrollHeight;
}

async function signUp() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const { user, error } = await supabase.auth.signUp({ email, password });
  log(document.getElementById("authLog"),
      error ? "Error: " + error.message : "User Created!");
}

async function signIn() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  log(document.getElementById("authLog"),
      error ? "Error: " + error.message : "Signed In!");
}

async function addCandle() {
  const p = document.getElementById("pair").value;
  const o = document.getElementById("open").value;
  const h = document.getElementById("high").value;
  const l = document.getElementById("low").value;
  const c = document.getElementById("close").value;
  const t = document.getElementById("timestamp").value;

  const { data, error } = await supabase
    .from("candles")
    .insert([{ pair: p, open: o, high: h, low: l, close: c, timestamp: t }]);

  log(document.getElementById("dataLog"),
      error ? "Error: " + error.message : "Candle Inserted!");
}
</script>

</body>
</html>
