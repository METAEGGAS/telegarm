<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Supabase Auth Demo</title>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/module/supabase.min.js'

// =============================
// إعداد Supabase
// =============================
const supabaseUrl = 'https://jgbchbqgofimmgwzzoia.supabase.co'
const supabaseKey = 'sb_publishable_mkNhancggR91jzTuzFryJQ_mQgHS0Qm' // Public key
const supabase = createClient(supabaseUrl, supabaseKey)

// =============================
// إنشاء حساب جديد
// =============================
window.signUp = async () => {
  const email = document.getElementById('email').value
  const password = document.getElementById('password').value
  const { user, error } = await supabase.auth.signUp({ email, password })
  const log = document.getElementById('authLog')
  log.textContent = error ? 'خطأ: ' + error.message : 'تم إنشاء الحساب بنجاح! UID: ' + user?.id
}

// =============================
// تسجيل دخول
// =============================
window.signIn = async () => {
  const email = document.getElementById('email').value
  const password = document.getElementById('password').value
  const { data, error } = await supabase.auth.signInWithPassword({ email, password })
  const log = document.getElementById('authLog')
  log.textContent = error ? 'خطأ: ' + error.message : 'تم تسجيل الدخول بنجاح! UID: ' + data.user?.id
}
</script>
<style>
body { font-family: Arial; padding: 20px; background: #f0f0f0; }
input, button { padding: 8px; margin: 5px 0; width: 100%; }
button { cursor: pointer; }
.log { border: 1px solid #ccc; padding: 8px; height: 100px; overflow:auto; background: #fff; }
h2 { color: #0077b6; }
</style>
</head>
<body>
<h2>تسجيل الدخول / إنشاء حساب</h2>
<input id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="signUp()">إنشاء حساب</button>
<button onclick="signIn()">تسجيل دخول</button>
<pre id="authLog" class="log"></pre>
</body>
</html>
