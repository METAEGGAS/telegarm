<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>لوحة تحكم Trading</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* ════════════════════════════════════════
   VARIABLES & RESET
════════════════════════════════════════ */
:root{
  --bg:     #0d1117;
  --bg2:    #161b27;
  --bg3:    #1e2535;
  --bg4:    #252d3d;
  --border: #2a3348;
  --green:  #3ecf8e;
  --green2: #22a86f;
  --blue:   #5865f2;
  --cyan:   #22d3ee;
  --red:    #f87171;
  --yellow: #fbbf24;
  --purple: #a78bfa;
  --orange: #fb923c;
  --text:   #e2e8f0;
  --text2:  #8892a4;
  --text3:  #4a5568;
  --shadow: 0 8px 32px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
}

/* ════════════════════════════════════════
   AUTH SCREEN
════════════════════════════════════════ */
#authScreen{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background: radial-gradient(ellipse at 50% -20%, rgba(62,207,142,.15) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 80%, rgba(88,101,242,.1) 0%, transparent 50%),
              var(--bg);
  z-index:999;
}
.auth-box{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:36px 32px;
  width:100%;max-width:420px;
  box-shadow:var(--shadow);
}
.auth-logo{
  display:flex;align-items:center;gap:10px;
  margin-bottom:28px;
  font-size:20px;font-weight:700;color:var(--green);
}
.auth-logo svg{width:32px;height:32px}
.auth-tabs{
  display:flex;
  background:var(--bg3);
  border-radius:10px;
  padding:4px;
  margin-bottom:24px;
}
.auth-tab{
  flex:1;padding:8px;text-align:center;
  border-radius:7px;cursor:pointer;
  font-size:13px;color:var(--text2);
  transition:all .2s;
}
.auth-tab.active{background:var(--bg);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.field-group{margin-bottom:16px}
.field-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.field-group input{
  width:100%;padding:10px 14px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:9px;
  color:var(--text);font-size:14px;
  outline:none;transition:border .2s;
}
.field-group input:focus{border-color:var(--green)}
.field-group input::placeholder{color:var(--text3)}
.btn-auth{
  width:100%;padding:12px;
  background:var(--green);
  border:none;border-radius:9px;
  color:#000;font-size:15px;font-weight:700;
  cursor:pointer;transition:all .2s;
  margin-top:4px;
}
.btn-auth:hover{background:var(--green2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(62,207,142,.4)}
.auth-msg{
  margin-top:14px;padding:10px 14px;
  border-radius:8px;font-size:13px;text-align:center;
  display:none;
}
.auth-msg.error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.auth-msg.success{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3);color:var(--green)}

/* ════════════════════════════════════════
   HEADER
════════════════════════════════════════ */
#app{display:none;height:100vh;flex-direction:column}
header{
  height:58px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  flex-shrink:0;
  z-index:10;
}
.hd-left{display:flex;align-items:center;gap:12px}
.hd-logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--green)}
.hd-logo svg{width:24px;height:24px}
.hd-divider{width:1px;height:20px;background:var(--border)}
.hd-title{font-size:13px;color:var(--text2)}
.hd-right{display:flex;align-items:center;gap:10px}
.user-chip{
  display:flex;align-items:center;gap:7px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:20px;padding:5px 12px 5px 6px;
  font-size:12px;
}
.user-avatar{
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--blue));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#000;
}
.conn-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--red);
  transition:background .3s;
}
.conn-dot.on{background:var(--green)}
.conn-label{font-size:11px;color:var(--text2)}
.btn-sm{
  display:flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg3);
  color:var(--text);font-size:12px;cursor:pointer;
  transition:all .15s;
}
.btn-sm:hover{border-color:var(--red);color:var(--red)}

/* ════════════════════════════════════════
   BODY LAYOUT
════════════════════════════════════════ */
.body-layout{
  display:flex;
  flex:1;
  overflow:hidden;
}

/* ════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════ */
aside{
  width:220px;
  background:var(--bg2);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  flex-shrink:0;
  overflow:hidden;
}
.sb-section{padding:14px 12px 6px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:600}
.sb-list{flex:1;overflow-y:auto;padding:4px 8px}
.sb-list::-webkit-scrollbar{width:3px}
.sb-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sb-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:8px;
  cursor:pointer;font-size:13px;color:var(--text2);
  transition:all .15s;margin-bottom:2px;
  position:relative;
}
.sb-item:hover{background:var(--bg3);color:var(--text)}
.sb-item.active{background:rgba(62,207,142,.12);color:var(--green)}
.sb-item .sb-badge{
  margin-right:auto;font-size:10px;
  background:var(--bg4);color:var(--text2);
  border:1px solid var(--border);
  border-radius:20px;padding:1px 7px;
}
.sb-item.active .sb-badge{background:rgba(62,207,142,.15);color:var(--green);border-color:rgba(62,207,142,.3)}
.sb-item .sb-icon{font-size:15px}
.sb-realtime{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);
  animation:blink 1.2s infinite;
  flex-shrink:0;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ════════════════════════════════════════
   MAIN
════════════════════════════════════════ */
main{
  flex:1;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}

/* ════════════════════════════════════════
   STATS ROW
════════════════════════════════════════ */
.stats-row{
  display:flex;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);flex-shrink:0;
  overflow-x:auto;
}
.stats-row::-webkit-scrollbar{height:3px}
.stat{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:10px 16px;min-width:120px;flex:1;
}
.stat .s-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat .s-val{font-size:20px;font-weight:700}
.stat .s-val.g{color:var(--green)}
.stat .s-val.b{color:var(--cyan)}
.stat .s-val.p{color:var(--purple)}
.stat .s-val.y{color:var(--yellow)}
.stat .s-val.r{color:var(--red)}
.stat .s-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ════════════════════════════════════════
   TOOLBAR
════════════════════════════════════════ */
.toolbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;border-bottom:1px solid var(--border);
  flex-shrink:0;flex-wrap:wrap;
}
.toolbar h2{font-size:15px;font-weight:600;flex:1;min-width:120px}
.search-wrap{
  display:flex;align-items:center;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:7px;padding:0 10px;gap:6px;
}
.search-wrap input{
  background:transparent;border:none;outline:none;
  color:var(--text);font-size:12px;padding:7px 2px;width:170px;
}
.search-wrap input::placeholder{color:var(--text3)}
select.rows-sel{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-size:12px;
  padding:6px 10px;outline:none;cursor:pointer;
}
.btn-tool{
  display:flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg3);
  color:var(--text);font-size:12px;cursor:pointer;transition:all .15s;
}
.btn-tool:hover{border-color:var(--green);color:var(--green)}

/* ════════════════════════════════════════
   DATA TABLE
════════════════════════════════════════ */
.tbl-wrap{flex:1;overflow:auto}
.tbl-wrap::-webkit-scrollbar{width:5px;height:5px}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{position:sticky;top:0;z-index:5;background:var(--bg2)}
thead th{
  padding:10px 12px;text-align:right;
  font-weight:600;color:var(--text2);font-size:11px;
  text-transform:uppercase;letter-spacing:.4px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
thead th .th-type{
  font-size:9px;margin-right:4px;
  background:rgba(88,101,242,.15);color:var(--blue);
  border:1px solid rgba(88,101,242,.25);
  border-radius:3px;padding:1px 4px;
  text-transform:none;letter-spacing:0;font-weight:500;
}
tbody tr{border-bottom:1px solid rgba(42,51,72,.5);transition:background .1s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody td{
  padding:8px 12px;color:var(--text);
  max-width:280px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;vertical-align:middle;
}
.c-null{color:var(--text3);font-style:italic;font-size:11px}
.c-num{color:var(--cyan);font-family:monospace}
.c-bool-t{color:var(--green)}
.c-bool-f{color:var(--red)}
.c-date{color:var(--yellow);font-size:11px}
.c-json{color:var(--purple);font-size:10px;font-family:monospace}
.c-uuid{color:var(--text3);font-size:10px;font-family:monospace}
.c-idx{color:var(--text3);font-size:11px;text-align:center}
.badge-buy{
  background:rgba(62,207,142,.15);color:var(--green);
  border:1px solid rgba(62,207,142,.3);
  border-radius:5px;padding:2px 8px;font-size:11px;font-weight:600;
}
.badge-sell{
  background:rgba(248,113,113,.15);color:var(--red);
  border:1px solid rgba(248,113,113,.3);
  border-radius:5px;padding:2px 8px;font-size:11px;font-weight:600;
}
.badge-active{background:rgba(251,191,36,.12);color:var(--yellow);border:1px solid rgba(251,191,36,.3);border-radius:5px;padding:2px 8px;font-size:11px}
.badge-won{background:rgba(62,207,142,.12);color:var(--green);border:1px solid rgba(62,207,142,.3);border-radius:5px;padding:2px 8px;font-size:11px}
.badge-lost{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3);border-radius:5px;padding:2px 8px;font-size:11px}
.badge-demo{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.3);border-radius:5px;padding:2px 8px;font-size:11px}
.badge-real{background:rgba(251,146,60,.12);color:var(--orange);border:1px solid rgba(251,146,60,.3);border-radius:5px;padding:2px 8px;font-size:11px}
.expand-btn{
  cursor:pointer;color:var(--blue);font-size:10px;
  border:1px solid rgba(88,101,242,.35);border-radius:4px;
  padding:1px 6px;background:rgba(88,101,242,.08);
}
.expand-btn:hover{background:rgba(88,101,242,.2)}
.row-view-btn{
  background:rgba(88,101,242,.1);border:1px solid rgba(88,101,242,.3);
  border-radius:5px;padding:3px 8px;
  font-size:11px;color:var(--blue);cursor:pointer;
}
.row-view-btn:hover{background:rgba(88,101,242,.25)}

/* ════════════════════════════════════════
   PAGINATION
════════════════════════════════════════ */
.pager{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-top:1px solid var(--border);
  background:var(--bg2);flex-shrink:0;flex-wrap:wrap;gap:8px;
}
.pager-info{font-size:12px;color:var(--text2)}
.pager-info strong{color:var(--text)}
.pager-btns{display:flex;gap:4px}
.pg-btn{
  padding:4px 10px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg3);
  color:var(--text);font-size:12px;cursor:pointer;transition:all .15s;
}
.pg-btn:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.pg-btn:disabled{opacity:.35;cursor:not-allowed}
.pg-btn.cur{background:var(--green);color:#000;border-color:var(--green);font-weight:700}

/* ════════════════════════════════════════
   SPECIAL VIEWS
════════════════════════════════════════ */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;gap:14px}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:13px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;gap:10px;color:var(--text2)}
.empty .e-icon{font-size:42px}
.empty p{font-size:13px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;color:var(--text2);padding:40px;text-align:center}
.welcome .w-icon{font-size:64px}
.welcome h2{font-size:22px;color:var(--text);font-weight:700}
.welcome p{font-size:14px;max-width:420px;line-height:1.7}
.welcome .w-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.w-card{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:14px 18px;min-width:130px;
  cursor:pointer;transition:all .2s;text-align:center;
}
.w-card:hover{border-color:var(--green);transform:translateY(-2px);background:rgba(62,207,142,.07)}
.w-card .wc-icon{font-size:22px;margin-bottom:6px}
.w-card .wc-name{font-size:12px;color:var(--text);font-weight:600}
.w-card .wc-count{font-size:11px;color:var(--text2);margin-top:2px}

/* ════════════════════════════════════════
   MODAL
════════════════════════════════════════ */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;backdrop-filter:blur(4px);padding:20px;
  display:none;
}
.modal{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:16px;max-width:640px;width:100%;
  max-height:85vh;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.6);
}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--border);
}
.modal-hd h3{font-size:14px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:4px 7px;border-radius:6px}
.modal-close:hover{background:var(--bg3);color:var(--text)}
.modal-bd{flex:1;overflow-y:auto;padding:16px 18px}
.modal-bd::-webkit-scrollbar{width:4px}
.modal-bd::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.df{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.df .dk{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.df .dv{font-size:12px;color:var(--text);word-break:break-all}
.df .dv.mono{font-family:monospace;color:var(--cyan)}
pre.json-pre{
  background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:14px;font-size:11px;
  color:var(--green);white-space:pre-wrap;word-break:break-word;
  font-family:monospace;
}

/* ════════════════════════════════════════
   CANDLES CHART VIEW
════════════════════════════════════════ */
.candle-filter{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 16px;border-bottom:1px solid var(--border);
  background:var(--bg2);flex-shrink:0;
}
.pair-btn{
  padding:5px 12px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg3);
  color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;
}
.pair-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.pair-btn.sel{background:rgba(34,211,238,.12);border-color:var(--cyan);color:var(--cyan);font-weight:600}

/* ════════════════════════════════════════
   TOAST
════════════════════════════════════════ */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:9px 18px;font-size:12px;color:var(--text);
  z-index:99999;opacity:0;transition:all .3s;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(62,207,142,.5);color:var(--green)}
.toast.err{border-color:rgba(248,113,113,.5);color:var(--red)}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     AUTH SCREEN
══════════════════════════════════════ -->
<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M21.362 9.354H12V.396a.396.396 0 00-.716-.233L2.203 12.424l-.401.562a1.04 1.04 0 00.836 1.659H12v8.958a.396.396 0 00.716.233l9.081-12.261.401-.562a1.04 1.04 0 00-.836-1.659z" fill="#3ecf8e"/>
      </svg>
      Trading Dashboard
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">تسجيل الدخول</div>
      <div class="auth-tab" id="tabRegister" onclick="switchAuth('register')">إنشاء حساب</div>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="field-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="field-group">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <button class="btn-auth" onclick="doLogin()" id="btnLogin">دخول →</button>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display:none">
      <div class="field-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="regEmail" placeholder="you@example.com" />
      </div>
      <div class="field-group">
        <label>كلمة المرور</label>
        <input type="password" id="regPassword" placeholder="6 أحرف على الأقل" />
      </div>
      <div class="field-group">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="regPassword2" placeholder="••••••••" onkeydown="if(event.key==='Enter')doRegister()" />
      </div>
      <button class="btn-auth" onclick="doRegister()" id="btnReg">إنشاء حساب →</button>
    </div>

    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MAIN APP
══════════════════════════════════════ -->
<div id="app" style="display:none;flex-direction:column;height:100vh">
  <!-- Header -->
  <header>
    <div class="hd-left">
      <div class="hd-logo">
        <svg viewBox="0 0 24 24" fill="none" width="22" height="22">

// ──────────────────────────────────────
//  AUTH SWITCH
// ──────────────────────────────────────
function switchAuth(mode){
  document.getElementById('loginForm').style.display    = mode==='login'    ? '' : 'none';
  document.getElementById('registerForm').style.display = mode==='register' ? '' : 'none';
  document.getElementById('tabLogin').classList.toggle('active',    mode==='login');
  document.getElementById('tabRegister').classList.toggle('active', mode==='register');
  document.getElementById('authMsg').style.display='none';
}

function showAuthMsg(msg, type='error'){
  const el = document.getElementById('authMsg');
  el.textContent = msg;
  el.className = 'auth-msg '+(type==='error'?'error':'success');
  el.style.display='block';
}

// ──────────────────────────────────────
//  LOGIN
// ──────────────────────────────────────
async function doLogin(){
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!email||!password){ showAuthMsg('يرجى إدخال البيانات كاملة'); return; }

  const btn = document.getElementById('btnLogin');
  btn.textContent='...جارٍ الدخول'; btn.disabled=true;

  const {data,error} = await sb.auth.signInWithPassword({email,password});
  btn.textContent='دخول →'; btn.disabled=false;

  if(error){ showAuthMsg(translateError(error.message)); return; }
  // onAuthStateChange will handle the rest
}

// ──────────────────────────────────────
//  REGISTER
// ──────────────────────────────────────
async function doRegister(){
  const email  = document.getElementById('regEmail').value.trim();
  const pass1  = document.getElementById('regPassword').value;
  const pass2  = document.getElementById('regPassword2').value;

  if(!email||!pass1||!pass2){ showAuthMsg('يرجى ملء جميع الحقول'); return; }
  if(pass1!==pass2)          { showAuthMsg('كلمتا المرور غير متطابقتين'); return; }
  if(pass1.length<6)         { showAuthMsg('كلمة المرور 6 أحرف على الأقل'); return; }

  const btn = document.getElementById('btnReg');
  btn.textContent='...جارٍ الإنشاء'; btn.disabled=true;

  const {data,error} = await sb.auth.signUp({
    email,
    password:pass1,
    options:{data:{email}}
  });
  btn.textContent='إنشاء حساب →'; btn.disabled=false;

  if(error){ showAuthMsg(translateError(error.message)); return; }

  if(data.user && !data.session){
    showAuthMsg('✅ تم الإنشاء! تحقق من بريدك الإلكتروني لتأكيد الحساب.','success');
  } else if(data.session){
    // auto-login
  }
}

function translateError(msg){
  if(msg.includes('Invalid login'))       return '❌ بيانات الدخول غير صحيحة';
  if(msg.includes('Email not confirmed')) return '📧 يرجى تأكيد البريد الإلكتروني أولاً';
  if(msg.includes('already registered'))  return '⚠️ البريد مسجّل مسبقاً';
  if(msg.includes('Password should'))     return '🔒 كلمة المرور ضعيفة جداً';
  return msg;
}

// ──────────────────────────────────────
//  LOAD COUNTS
// ──────────────────────────────────────

  const promises = tables.map(async t => {

      tableCounts[t]='?';

  });

}

      <div class="stat"><div class="s-label">الصفحة الحالية</div><div class="s-val b" id="sPage">—</div><div class="s-sub">من ${Math.ceil((cnt||0)/pageSize)||1} صفحة</div></div>

      <div class="stat"><div class="s-label">صفقات فعالة</div><div class="s-val y" id="sActive">—</div><div class="s-sub">في لحظة الآن</div></div>

        <option value="50" ${pageSize===50?'selected':''}>50</option>
        <option value="100" ${pageSize===100?'selected':''}>100</option>
        <option value="200" ${pageSize===200?'selected':''}>200</option>
      </select>
      <button class="btn-tool" onclick="fetchData()">🔄 تحديث</button>
      <button class="btn-tool" onclick="exportCSV()">⬇️ CSV</button>

      <div class="loading"><div class="spinner"></div><p>جارٍ تحميل البيانات...</p></div>

// ──────────────────────────────────────
//  LOAD PAIRS (for candles filter)
// ──────────────────────────────────────
async function loadPairs(){
  try{
    const {data} = await sb.from('candles').select('pair').order('pair');
    if(!data) return;
    const pairs = [...new Set(data.map(r=>r.pair))];
    const sel = document.getElementById('pairFilter');
    if(sel) pairs.forEach(p=>{
      const o=document.createElement('option'); o.value=p; o.textContent=p; sel.appendChild(o);
    });
  }catch{}
}

// ──────────────────────────────────────
//  FETCH DATA
// ──────────────────────────────────────
async function fetchData(){
  if(!currentTable) return;
  const wrap = document.getElementById('tblWrap');
  if(!wrap) return;
  wrap.innerHTML = '<div class="loading"><div class="spinner"></div><p>جارٍ التحميل...</p></div>';

  try{
    const from = currentPage*pageSize;
    const to   = from+pageSize-1;

    let q = sb.from(currentTable).select('*',{count:'exact'}).range(from,to);

    // Pair filter for candles
    if(currentTable==='candles'){
      const pf = document.getElementById('pairFilter');
      if(pf?.value) q = q.eq('pair', pf.value);
      q = q.order('timestamp',{ascending:false});
    }
    // Default ordering
    if(['users','trades','live_candles'].includes(currentTable)){
      q = q.order('created_at',{ascending:false}).order('updated_at',{ascending:false, nullsFirst:false});
    }

    const {data, error, count} = await q;
    if(error) throw error;

    totalRows = count??0;
    tableCounts[currentTable] = totalRows;
    renderSidebar();

    const statsT = document.getElementById('sTotal');
    if(statsT) statsT.textContent = totalRows.toLocaleString('ar-EG');
    const statsP = document.getElementById('sPage');
    if(statsP) statsP.textContent = (currentPage+1)+'';
    const statsS = document.getElementById('sShown');
    if(statsS) statsS.textContent = (data?.length||0)+'';

    if(!data||data.length===0){
      wrap.innerHTML='<div class="empty"><div class="e-icon">📭</div><p>لا توجد بيانات</p></div>';
      document.getElementById('pagerBar').style.display='none';
      return;
    }

    renderTable(data);
    renderPager(count??0);

  }catch(e){
    wrap.innerHTML=`<div class="empty"><div class="e-icon">⚠️</div><p>خطأ: ${e.message}</p></div>`;
    showToast('خطأ في جلب البيانات','err');
  }
}

// ──────────────────────────────────────
//  RENDER TABLE
// ──────────────────────────────────────
function renderTable(data){
  const wrap = document.getElementById('tblWrap');
  if(!wrap) return;
  const schema = SCHEMA[currentTable]||[];
  const cols = schema.length ? schema.map(s=>s.col) : Object.keys(data[0]||{});

  const thead = cols.map(c=>{
    const s = schema.find(x=>x.col===c);
    return `<th>${s?.icon||''} ${c} <span class="th-type">${s?.type||''}</span></th>`;
  }).join('');

  const from = currentPage*pageSize;
  const tbody = data.map((row,i)=>`
    <tr>
      <td class="c-idx">${from+i+1}</td>
      ${cols.map(c=>renderCell(row[c],c,currentTable)).join('')}
      <td><button class="row-view-btn" onclick='openRow(${JSON.stringify(JSON.stringify(row))})'>👁️</button></td>
    </tr>
  `).join('');

  wrap.innerHTML=`
    <table>
      <thead><tr><th style="width:40px;text-align:center">#</th>${thead}<th style="width:50px"></th></tr></thead>
      <tbody>${tbody}</tbody>
    </table>`;
}

// ──────────────────────────────────────
//  RENDER CELL
// ──────────────────────────────────────
function renderCell(v, col, table){
  if(v===null||v===undefined) return '<td class="c-null">NULL</td>';
  if(typeof v==='boolean') return `<td class="${v?'c-bool-t':'c-bool-f'}">${v?'✓ نعم':'✗ لا'}</td>`;

  // Special badges
  if(col==='type'  && (v==='buy'||v==='sell'))
    return `<td><span class="badge-${v}">${v==='buy'?'🟢 شراء':'🔴 بيع'}</span></td>`;
  if(col==='status')
    return `<td><span class="badge-${v}">${v==='active'?'⏳ فعال':v==='won'?'✅ ربح':'❌ خسارة'}</span></td>`;
  if(col==='account')
    return `<td><span class="badge-${v}">${v==='demo'?'🎮 تجريبي':'💰 حقيقي'}</span></td>`;
  if(col==='is_active'||col==='active')
    return `<td class="${v?'c-bool-t':'c-bool-f'}">${v?'✓ نعم':'✗ لا'}</td>`;

  if(typeof v==='number') return `<td class="c-num">${v.toLocaleString('ar-EG')}</td>`;

  if(typeof v==='object'){
    const s=JSON.stringify(v);
    const prev=s.length>40?s.substring(0,40)+'...':s;
    return `<td class="c-json"><span class="expand-btn" onclick='openJSON(${JSON.stringify(JSON.stringify(v))}, "${col}")'>JSON ↗</span>${prev}</td>`;
  }

  const s=String(v);
  // UUID
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(s))
    return `<td class="c-uuid" title="${s}">${s.substring(0,8)}…</td>`;
  // Timestamp (large number → date)
  if(col.includes('time')&&/^\d{12,13}$/.test(s)){
    const d=new Date(+s);
    return `<td class="c-date" title="${s}">${d.toLocaleString('ar-EG')}</td>`;
  }
  // ISO date
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){
    const d=new Date(s);
    return `<td class="c-date">${d.toLocaleString('ar-EG')}</td>`;
  }
  // PnL coloring
  if(col==='pnl'){
    const n=parseFloat(s);
    const cls=n>0?'c-bool-t':n<0?'c-bool-f':'c-num';
    return `<td class="${cls}">${n>0?'+':''}${n.toLocaleString('ar-EG')}</td>`;
  }
  // Long text
  if(s.length>70) return `<td title="${s.replace(/"/g,'&quot;')}">${s.substring(0,70)}…</td>`;
  return `<td>${s}</td>`;
}

// ──────────────────────────────────────
//  PAGER
// ──────────────────────────────────────
function renderPager(total){
  const bar = document.getElementById('pagerBar');
  if(!bar) return;
  const pages = Math.ceil(total/pageSize);
  if(pages<=1){
    bar.style.display='flex';
    bar.innerHTML=`<span class="pager-info">إجمالي: <strong>${total.toLocaleString('ar-EG')}</strong> صف</span><div></div>`;
    return;
  }
  bar.style.display='flex';
  const start=Math.max(0,currentPage-2);
  const end  =Math.min(pages-1,currentPage+2);
  let btns='';
  for(let p=start;p<=end;p++)
    btns+=`<button class="pg-btn ${p===currentPage?'cur':''}" onclick="goPage(${p})">${p+1}</button>`;

  bar.innerHTML=`
    <span class="pager-info">إجمالي: <strong>${total.toLocaleString('ar-EG')}</strong> صف | صفحة ${currentPage+1} / ${pages}</span>
    <div class="pager-btns">
      <button class="pg-btn" onclick="goPage(0)"       ${currentPage===0?'disabled':''}>⏮</button>
      <button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>→</button>
      ${btns}
      <button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages-1?'disabled':''}>←</button>
      <button class="pg-btn" onclick="goPage(${pages-1})" ${currentPage===pages-1?'disabled':''}>⏭</button>
    </div>`;
}

function goPage(p){
  currentPage=p;
  fetchData();
  document.getElementById('tblWrap')?.scrollTo(0,0);
}

// ──────────────────────────────────────
//  SEARCH
// ──────────────────────────────────────
let srchTimer;
function onSearch(v){
  searchQ=v;
  clearTimeout(srchTimer);
  srchTimer=setTimeout(()=>{currentPage=0;fetchData();},400);
}

// ──────────────────────────────────────
//  TRADE STATS
// ──────────────────────────────────────
async function loadTradeStats(){
  try{
    const {data} = await sb.from('trades').select('status,pnl').eq('uid', currentUser.id);
    if(!data) return;
    const active = data.filter(r=>r.status==='active').length;
    const pnl    = data.reduce((s,r)=>(r.pnl?s+parseFloat(r.pnl):s),0);
    const aEl = document.getElementById('sActive');
    const pEl = document.getElementById('sPnl');
    if(aEl) aEl.textContent=active;
    if(pEl){
      pEl.textContent=(pnl>=0?'+':'')+pnl.toFixed(2);
      pEl.className='s-val '+(pnl>0?'g':pnl<0?'r':'b');
    }
  }catch{}
}

// ──────────────────────────────────────
//  EXPORT CSV
// ──────────────────────────────────────
async function exportCSV(){
  try{
    showToast('جارٍ التصدير...','');
    const {data,error}=await sb.from(currentTable).select('*').limit(5000);
    if(error||!data) throw error||new Error('لا بيانات');
    const cols=Object.keys(data[0]);
    const csv=[
      cols.join(','),
      ...data.map(r=>cols.map(c=>{
        const v=r[c];
        if(v===null) return '';
        const s=typeof v==='object'?JSON.stringify(v):String(v);
        return (s.includes(',')||s.includes('"')||s.includes('\n'))?`"${s.replace(/"/g,'""')}"`  :s;
      }).join(','))
    ].join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));
    a.download=`${currentTable}_export.csv`;
    a.click();
    showToast(`✅ تم تصدير ${data.length} صف`,'ok');
  }catch(e){showToast('خطأ في التصدير','err')}
}

// ──────────────────────────────────────
//  REALTIME
// ──────────────────────────────────────
function setupRealtime(t){
  const REALTIME_TABLES = ['live_candles','chart_control'];
  if(!REALTIME_TABLES.includes(t)) return;

  // Remove old sub
  if(realtimeSubs[t]){ sb.removeChannel(realtimeSubs[t]); delete realtimeSubs[t]; }

  const channel = sb.channel(`rt_${t}`)
    .on('postgres_changes',{event:'*',schema:'public',table:t},()=>{
      fetchData();
      showToast(`⚡ تحديث جديد في ${t}`,'ok');
    })
    .subscribe(status=>{
      if(status==='SUBSCRIBED') setConn(true,'متصل • Realtime');
    });

  realtimeSubs[t]=channel;
}

// ──────────────────────────────────────
//  MODAL
// ──────────────────────────────────────
function openRow(rowJson){
  const row=JSON.parse(rowJson);
  document.getElementById('modalTitle').textContent='📋 تفاصيل الصف';
  document.getElementById('modalBody').innerHTML=`
    <div class="detail-grid">
      ${Object.entries(row).map(([k,v])=>`
        <div class="df">
          <div class="dk">${k}</div>
          <div class="dv ${typeof v==='number'?'mono':''}" style="${v===null?'color:var(--text3);font-style:italic':''}">
            ${v===null?'NULL':typeof v==='object'?`<pre class="json-pre">${JSON.stringify(v,null,2)}</pre>`:String(v)}
          </div>
        </div>`).join('')}
    </div>`;
  document.getElementById('modalBg').style.display='flex';
}

function openJSON(jsonStr, col){
  const v=JSON.parse(jsonStr);
  document.getElementById('modalTitle').textContent=`{ } ${col}`;
  document.getElementById('modalBody').innerHTML=`<pre class="json-pre">${JSON.stringify(v,null,2)}</pre>`;
  document.getElementById('modalBg').style.display='flex';
}

function closeModal(){ document.getElementById('modalBg').style.display='none'; }
function closeModalBg(e){ if(e.target.id==='modalBg') closeModal(); }

// ──────────────────────────────────────
//  STATUS
// ──────────────────────────────────────
function setConn(ok,label){
  const dot=document.getElementById('connDot');
  const lbl=document.getElementById('connLabel');
  if(dot){ dot.className='conn-dot'+(ok?' on':''); }
  if(lbl) lbl.textContent=label;
}

// ──────────────────────────────────────
//  TOAST
// ──────────────────────────────────────
let toastTimer;
function showToast(msg, type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast '+type+' show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.className='toast';},3000);
}
</script>
